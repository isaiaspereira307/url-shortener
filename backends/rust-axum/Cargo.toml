[package]
name = "url-shortener-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
redis = { version = "0.32", features = ["tokio-comp", "tokio-rustls-comp"] }
jsonwebtoken = "9"
argon2 = "0.5"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
rand = "0.9"
nanoid = "0.4"
sha2 = "0.10"
md-5 = "0.10"
digest = "0.10"
hex = "0.4"
regex = "1"
chrono = { version = ">=0.4.38, <0.4.40", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.20", features = ["derive"] }
url = ">=2.4, <2.6"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
config = { version = "0.15", features = ["toml"] }
dotenvy = "0.15"
base64 = "0.22"

# Pin transitive deps to avoid MSRV bumps requiring rustc 1.86+
time = ">=0.3.36, <0.3.45"
idna = ">=0.5, <1.0"
home = ">=0.5.9, <0.5.12"
idna_adapter = ">=1.0, <1.2"

[dev-dependencies]
tokio-test = "0.4"
