worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=shorten_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=redirect_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstream backends
    upstream python_backend {
        server python-backend:8000;
    }

    upstream rust_backend {
        server rust-backend:8001;
    }

    upstream go_backend {
        server go-backend:8002;
    }

    # Round-robin upstream for redirect routes
    upstream redirect_backend {
        server python-backend:8000;
        server rust-backend:8001;
        server go-backend:8002;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.qrserver.com; font-src 'self'; connect-src 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Serve frontend static files
        root /usr/share/nginx/html;
        index index.html;

        # Frontend SPA - all routes go to index.html except API
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Python backend API routes
        location /api/python/ {
            proxy_pass http://python_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rust backend API routes
        location /api/rust/ {
            proxy_pass http://rust_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Go backend API routes
        location /api/go/ {
            proxy_pass http://go_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Python backend - shorten endpoint (rate limited)
        location /api/python/shorten {
            limit_req zone=shorten_limit burst=20 nodelay;
            proxy_pass http://python_backend/api/shorten;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Rust backend - shorten endpoint (rate limited)
        location /api/rust/shorten {
            limit_req zone=shorten_limit burst=20 nodelay;
            proxy_pass http://rust_backend/api/shorten;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Go backend - shorten endpoint (rate limited)
        location /api/go/shorten {
            limit_req zone=shorten_limit burst=20 nodelay;
            proxy_pass http://go_backend/api/shorten;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Python backend - auth endpoints (rate limited)
        location ~ ^/api/python/auth/(login|register) {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://python_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Rust backend - auth endpoints (rate limited)
        location ~ ^/api/rust/auth/(login|register) {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://rust_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Go backend - auth endpoints (rate limited)
        location ~ ^/api/go/auth/(login|register) {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://go_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Redirect routes - round-robin across all backends
        location ~ "^/[a-zA-Z0-9]{1,20}$" {
            limit_req zone=redirect_limit burst=100 nodelay;
            proxy_pass http://redirect_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Pixel tracking routes - round-robin across all backends
        location ~ ^/pixel/[a-zA-Z0-9_-]+\.png$ {
            proxy_pass http://redirect_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger/OpenAPI docs
        location /api/python/docs/ {
            proxy_pass http://python_backend/docs/;
            proxy_set_header Host $host;
        }
        location /api/python/openapi.json {
            proxy_pass http://python_backend/openapi.json;
            proxy_set_header Host $host;
        }
        location /api/rust/docs/ {
            proxy_pass http://rust_backend/swagger-ui/;
            proxy_set_header Host $host;
        }
        location /api/go/docs/ {
            proxy_pass http://go_backend/swagger/;
            proxy_set_header Host $host;
        }

        # Health check endpoints
        location = /health {
            proxy_pass http://python_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /api/rust/health {
            proxy_pass http://rust_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /api/go/health {
            proxy_pass http://go_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}